<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synkria - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff5f7; font-family: 'Inter', sans-serif; }
        .pink-gradient { background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%); }
        .purple-card { background: #6b46c1; color: white; }
        .circle-progress { border-radius: 50%; border: 8px solid #fecaca; border-top: 8px solid #f472b6; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-pink-600">Synkria</h1>
            <div class="w-10 h-10 bg-pink-200 rounded-full flex items-center justify-center">
                <i class="fa-solid fa-user text-pink-600"></i>
            </div>
        </header>

        <div class="bg-white rounded-3xl p-8 shadow-sm mb-6 text-center">
            <h2 class="text-gray-500 uppercase tracking-widest text-sm mb-4">Current Phase</h2>
            <div class="relative inline-block mb-4">
                <div class="w-48 h-48 circle-progress flex flex-col items-center justify-center">
                    <span class="text-4xl font-bold text-gray-800">Day 12</span>
                    <span class="text-pink-500 font-medium">Ovulation</span>
                </div>
            </div>
            <p class="text-gray-600">Chance of pregnancy: <span class="font-bold text-pink-500">High</span></p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-pink-100 p-4 rounded-2xl text-center">
                <p class="text-xs text-pink-700 font-semibold uppercase">Cycle Length</p>
                <p class="text-xl font-bold text-pink-900">28 Days</p>
            </div>
            <div class="bg-purple-100 p-4 rounded-2xl text-center">
                <p class="text-xs text-purple-700 font-semibold uppercase">Period Length</p>
                <p class="text-xl font-bold text-purple-900">5 Days</p>
            </div>
            <div class="bg-orange-100 p-4 rounded-2xl text-center">
                <p class="text-xs text-orange-700 font-semibold uppercase">Stress Level</p>
                <p class="text-xl font-bold text-orange-900">Moderate</p>
            </div>
            <div class="bg-blue-100 p-4 rounded-2xl text-center">
                <p class="text-xs text-blue-700 font-semibold uppercase">Next Period</p>
                <p class="text-xl font-bold text-blue-900">In 14 Days</p>
            </div>
        </div>

        <button class="w-full pink-gradient text-white py-4 rounded-2xl font-bold shadow-lg hover:opacity-90 transition">
            <i class="fa-solid fa-plus mr-2"></i> Log Today's Symptoms
        </button>

        <div class="mt-8">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Weekly Insights</h3>
            <div class="bg-white p-4 rounded-2xl shadow-sm flex items-center">
                <div class="bg-yellow-100 p-3 rounded-xl mr-4">
                    <i class="fa-solid fa-lightbulb text-yellow-600"></i>
                </div>
                <p class="text-sm text-gray-600">Based on your <strong>BMI (24.4)</strong> and low sleep, we recommend a light yoga session today to manage stress levels.</p>
            </div>
        </div>
    </div>

</body>
</html>
